name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contact
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: contact
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contact -d contact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: contact
      PGPASSWORD: ci-password
      PGDATABASE: contact

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run migrate
      - run: npm run test:integration
